# yaml-language-server: $schema=https://app.stainlessapi.com/config.schema.json

organization:
  name: honcho
  docs: https://docs.honcho.dev
  contact: hello@plasticlabs.ai
  github_org: plastic-labs
resources:
  workspaces:
    models:
      workspace: '#/components/schemas/Workspace'
      deriver_status: '#/components/schemas/DeriverStatus'
      message_search_options: "#/components/schemas/MessageSearchOptions"
    methods:
      get_or_create: post /v2/workspaces
      list: post /v2/workspaces/list
      update: put /v2/workspaces/{workspace_id}
      search: post /v2/workspaces/{workspace_id}/search
      deriver_status: get /v2/workspaces/{workspace_id}/deriver/status
    subresources:
      peers:
        models:
          page_session: '#/components/schemas/Page_Session_'
          peer: '#/components/schemas/Peer'
          session_get: '#/components/schemas/SessionGet'
          page_peer: "#/components/schemas/Page_Peer_"
        methods:
          list: post /v2/workspaces/{workspace_id}/peers/list
          get_or_create: post /v2/workspaces/{workspace_id}/peers
          update: put /v2/workspaces/{workspace_id}/peers/{peer_id}
          chat: post /v2/workspaces/{workspace_id}/peers/{peer_id}/chat
          working_representation: post /v2/workspaces/{workspace_id}/peers/{peer_id}/representation
          search: post /v2/workspaces/{workspace_id}/peers/{peer_id}/search
          card: get /v2/workspaces/{workspace_id}/peers/{peer_id}/card
        subresources:
          sessions:
            methods:
              list: post /v2/workspaces/{workspace_id}/peers/{peer_id}/sessions
      sessions:
        models:
          session: '#/components/schemas/Session'
        methods:
          get_or_create: post /v2/workspaces/{workspace_id}/sessions
          list: post /v2/workspaces/{workspace_id}/sessions/list
          update: put /v2/workspaces/{workspace_id}/sessions/{session_id}
          delete: delete /v2/workspaces/{workspace_id}/sessions/{session_id}
          clone: get /v2/workspaces/{workspace_id}/sessions/{session_id}/clone
          get_context: get /v2/workspaces/{workspace_id}/sessions/{session_id}/context
          search: post /v2/workspaces/{workspace_id}/sessions/{session_id}/search
          summaries: get /v2/workspaces/{workspace_id}/sessions/{session_id}/summaries
        subresources:
          messages:
            models:
              message: '#/components/schemas/Message'
              message_create: '#/components/schemas/MessageCreate'
            methods:
              create: post /v2/workspaces/{workspace_id}/sessions/{session_id}/messages/
              list: post /v2/workspaces/{workspace_id}/sessions/{session_id}/messages/list
              retrieve: get /v2/workspaces/{workspace_id}/sessions/{session_id}/messages/{message_id}
              update: put /v2/workspaces/{workspace_id}/sessions/{session_id}/messages/{message_id}
              upload: post /v2/workspaces/{workspace_id}/sessions/{session_id}/messages/upload
          peers:
            methods:
              add: post /v2/workspaces/{workspace_id}/sessions/{session_id}/peers
              set: put /v2/workspaces/{workspace_id}/sessions/{session_id}/peers
              remove: delete /v2/workspaces/{workspace_id}/sessions/{session_id}/peers
              list: get /v2/workspaces/{workspace_id}/sessions/{session_id}/peers
              get_config: get /v2/workspaces/{workspace_id}/sessions/{session_id}/peers/{peer_id}/config
              set_config: post /v2/workspaces/{workspace_id}/sessions/{session_id}/peers/{peer_id}/config
            models:
              session_peer_config: "#/components/schemas/SessionPeerConfig"
      webhooks:
        models:
          webhook_endpoint: "#/components/schemas/WebhookEndpoint"
        methods:
          get_or_create: post /v2/workspaces/{workspace_id}/webhooks
          list: get /v2/workspaces/{workspace_id}/webhooks
          delete: delete /v2/workspaces/{workspace_id}/webhooks/{endpoint_id}
          test_emit: get /v2/workspaces/{workspace_id}/webhooks/test
  keys:
    methods:
      create: post /v2/keys
targets:
  node:
    readme_title: honcho-ai
    production_repo: plastic-labs/honcho-node-core
    package_name: "@honcho-ai/core"
    publish:
      npm: true
    options:
      mcp_server:
        package_name: '@honcho-ai/mcp'
        enable_all_resources: true
  python:
    readme_title: honcho-ai
    production_repo: plastic-labs/honcho-python-core
    package_name: honcho_core
    project_name: honcho-core
    publish:
      pypi: true
settings:
  license: Apache-2.0
client_settings:
  opts:
    api_key:
      # or `token`, `auth_token`, etc.
      type: string
      nullable: true
      read_env: HONCHO_API_KEY
      auth: { security_scheme: HTTPBearer }
security:
  - HTTPBearer: []
  - {}
environments:
  demo: https://demo.honcho.dev
  local: http://localhost:8000
  production: https://api.honcho.dev
query_settings:
  nested_format: brackets
  array_format: comma
readme:
  example_requests:
    default:
      type: request
      endpoint: post /v2/workspaces
      params: &ref_0 {}
    headline:
      type: request
      endpoint: post /v2/workspaces
      params: *ref_0
    pagination:
      type: request
      endpoint: post /v2/workspaces/{workspace_id}/peers/list
      params:
        workspace_id: REPLACE_ME
pagination:
  - name: page
    type: page_number
    request:
      page:
        type: integer
        description: The page number
        x-stainless-pagination-property:
          purpose: page_number_param
      size:
        type: integer
        description: The number of items in a page
    response:
      total:
        type: integer
      items:
        type: array
        items: {}
        x-stainless-pagination-property:
          purpose: items
      page:
        type: integer
        x-stainless-pagination-property:
          purpose: current_page_number_field
      size:
        type: integer
      pages:
        type: integer
        x-stainless-pagination-property:
          purpose: total_page_count_field
openapi:
  code_samples: mintlify

